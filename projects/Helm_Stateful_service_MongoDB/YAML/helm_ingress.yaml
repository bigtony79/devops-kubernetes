apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongo-express-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: 69-164-197-54.ip.linodeusercontent.com #Replace with the hostname of the NodeBalancer
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mongo-express-service
              port:
                number: 8081

  
   
   
   
   
   
   
   
   
   