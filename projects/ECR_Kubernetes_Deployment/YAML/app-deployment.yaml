apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: docker-secret-key # Reference to the secret created for ECR authentication
      containers:
      - name: my-app-container
        image: 941837437887.dkr.ecr.us-east-1.amazonaws.com/my-app:1.0 # Replace with your ECR image URI
        imagePullPolicy: Always # Forces the image to be pulled every time a pod is created
        ports:
        - containerPort: 3000
